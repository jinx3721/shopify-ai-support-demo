<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartSupport｜Shopify AI 售后中台 Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}
.app{display:flex;min-height:100vh}.side{width:230px;background:#101827;color:#cbd5e1;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{color:#fff;font-weight:700;font-size:16px;padding:8px 10px 25px}.brand small{display:block;color:#7f8ba0;font-size:10px;margin-top:5px;font-weight:400}
.navtitle{font-size:10px;color:#69758a;padding:8px 10px}.nav{display:block;width:100%;border:0;background:transparent;color:#aeb9c9;text-align:left;padding:10px;border-radius:7px;margin:2px 0;cursor:pointer}.nav.active,.nav:hover{background:#1d2a3d;color:#fff}.nav em{float:right;background:#ef4444;color:#fff;border-radius:9px;padding:1px 5px;font-style:normal;font-size:10px}
.demo{position:absolute;bottom:15px;left:12px;right:12px;background:#172235;border:1px solid #27364d;padding:10px;border-radius:8px;font-size:10px}.green{color:#22c55e}
.main{margin-left:230px;width:calc(100% - 230px);padding:25px 30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.crumb{font-size:11px;color:#8a96a8}h1{font-size:24px;margin:4px 0}.btn{border:1px solid #dfe5ed;background:#fff;padding:8px 12px;border-radius:7px;cursor:pointer}.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}
.hero{background:linear-gradient(120deg,#18243a,#293a5a);color:#fff;border-radius:12px;padding:24px;display:flex;justify-content:space-between;align-items:center}.hero h2{margin:12px 0 6px}.hero p{color:#bbc6d8;font-size:13px}.pill{font-size:10px;background:#173c34;color:#66e2b1;padding:5px 8px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card,.stat{background:#fff;border:1px solid #e5eaf0;border-radius:10px}.stat{padding:16px}.stat small,.muted{color:#8995a7;font-size:11px}.stat strong{display:block;font-size:27px;margin:7px 0}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}.card{padding:16px}.card h3{margin:0 0 12px;font-size:15px}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f4}.grow{flex:1}.row b{font-size:12px}.row span{display:block;color:#8995a7;font-size:10px;margin-top:4px}.avatar{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:grid;place-items:center;font-size:11px;font-weight:bold}.badge{background:#eef1f5;color:#5b6575;padding:4px 7px;border-radius:10px;font-size:10px}.ok{background:#e8f8ef;color:#15803d}.warn{background:#fff5dc;color:#b45309}
.split{display:grid;grid-template-columns:380px 1fr;gap:15px}.list{padding:0;overflow:hidden}.search{padding:11px;border-bottom:1px solid #edf0f4;display:flex;gap:6px}.search input{flex:1;border:1px solid #dfe5ed;border-radius:6px;padding:8px}.thread{padding:13px;display:flex;gap:9px;border-bottom:1px solid #edf0f4;cursor:pointer}.thread:hover,.thread.sel{background:#f4f6ff}.conversation{min-height:570px;padding:0}.convhead{padding:16px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between}.messages{padding:20px;background:#f8fafc;min-height:300px}.bubble{max-width:72%;padding:12px;border-radius:8px;margin-bottom:12px;font-size:12px;line-height:1.7}.customer{background:#fff;border:1px solid #e4e9ef}.ai{background:#eef2ff;margin-left:auto}.composer{padding:15px}.composer textarea{width:100%;height:110px;border:1px solid #dfe5ed;border-radius:7px;padding:9px}.actions{text-align:right;margin-top:8px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4}.table th{color:#8995a7}.toolbar{display:flex;justify-content:space-between;margin-bottom:14px}.shopgrid,.knowledge,.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.shop{display:flex;align-items:center;gap:12px}.shopicon{width:45px;height:45px;background:#eceaff;color:#4f46e5;border-radius:9px;display:grid;place-items:center;font-weight:bold}.switch{float:right;width:40px;height:22px;border:0;border-radius:12px;background:#4f46e5}.switch:after{content:"";display:block;width:18px;height:18px;background:white;border-radius:50%;margin-left:19px}.notice{background:#fff8e7;padding:12px;border-radius:8px;font-size:11px;color:#966b11}.toast{position:fixed;right:25px;top:20px;background:#172033;color:white;padding:10px 14px;border-radius:8px;font-size:12px}
@media(max-width:900px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px);padding:18px}.stats{grid-template-columns:1fr 1fr}.grid,.shopgrid,.knowledge,.settings,.split{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">◈ SmartSupport<small>Shopify AI 售后中台</small></div>
<div class="navtitle">工作台</div><button class="nav active" data-page="总览">⌂ 总览</button><button class="nav" data-page="邮件收件箱">✉ 邮件收件箱</button><button class="nav" data-page="AI 回复队列">✦ AI 回复队列 <em>3</em></button><button class="nav" data-page="订单售后">♧ 订单售后</button>
<div class="navtitle">配置</div><button class="nav" data-page="Shopify 店铺">▣ Shopify 店铺</button><button class="nav" data-page="AI 回复规则">⚙ AI 回复规则</button><button class="nav" data-page="知识库">▤ 知识库</button><button class="nav" data-page="邮箱设置">◎ 邮箱设置</button><button class="nav" data-page="系统设置">⚙ 系统设置</button>
<div class="demo"><span class="green">●</span> Demo 模式已开启<br><span class="muted">所有 Shopify / 邮箱 / AI 均为模拟数据</span></div></aside>
<main class="main"><header><div><div class="crumb">SmartSupport / <span id="crumb">总览</span></div><h1 id="title">总览</h1></div><button class="btn" onclick="toast('已刷新模拟数据')">↻ 刷新</button></header><div id="content"></div></main></div>
<script>
const cs=[
{id:'C-1048',email:'sarah@example.com',subject:"Order #US-10482 — tracking hasn't updated",shop:'US Main Store',order:'#US-10482',time:'今天 20:18',status:'待处理',body:'Hi, the tracking has not moved for 4 days. Could you check where my parcel is?'},
{id:'C-1047',email:'james@example.co.uk',subject:'Refund request for damaged item',shop:'UK Store',order:'#UK-8821',time:'今天 19:42',status:'AI已回复',body:'The product arrived damaged. I would like a refund.'},
{id:'C-1046',email:'emma@example.de',subject:'Where is my package?',shop:'EU Store',order:'#EU-3208',time:'今天 18:31',status:'待处理',body:'Can you tell me the latest delivery status?'}];
let selected=cs[0],page='总览';
function badge(x){return '<span class="badge '+(x==='在线'?'ok':x==='待授权'?'warn':'')+'">'+x+'</span>'}
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent='✓ '+s;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function go(p){page=p;document.getElementById('title').textContent=p;document.getElementById('crumb').textContent=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function dashboard(){return `<div class="hero"><div><span class="pill">● 系统运行正常</span><h2>今天的售后工作，交给 AI 先处理</h2><p>自动识别店铺 → 查询订单 → 读取历史邮件 → 生成专业回复。</p></div><button class="btn primary" onclick="go('AI 回复队列')">查看 AI 队列 →</button></div>
<div class="stats">${[['待处理邮件','12','需要 AI 判断'],['AI 已回复','36','今日自动完成'],['售后跟进','8','3 个超过 24 小时'],['已连接店铺','3 / 4','1 个待授权']].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>
<div class="grid"><div class="card"><h3>最近邮件</h3>${cs.map(c=>`<div class="row" onclick="go('邮件收件箱')"><div class="avatar">${c.email[0].toUpperCase()}</div><div class="grow"><b>${c.subject}</b><span>${c.email} · ${c.shop}</span></div>${badge(c.status)}</div>`).join('')}</div>
<div class="card"><h3>店铺状态</h3>${[['US Main Store','us-main.myshopify.com','在线','128'],['UK Store','uk-store.myshopify.com','在线','74'],['EU Store','eu-store.myshopify.com','在线','91'],['AU Store','au-store.myshopify.com','待授权','36']].map(x=>`<div class="row"><div class="shopicon">S</div><div class="grow"><b>${x[0]}</b><span>${x[1]}</span></div>${badge(x[2])}<span>${x[3]} 单</span></div>`).join('')}</div></div>`}
function inbox(queue=false){return `<div class="split"><div class="card list"><div class="search"><input id="q" placeholder="搜索客户、订单号、主题..."><button class="btn" onclick="renderInbox()">筛选</button></div><div id="threads"></div></div><div class="card conversation">${conversation()}</div></div>`}
function renderInbox(){let q=(document.getElementById('q')?.value||'').toLowerCase();let list=cs.filter(c=>(c.email+c.subject+c.order+c.shop).toLowerCase().includes(q));document.getElementById('threads').innerHTML=list.map(c=>`<div class="thread ${selected.id===c.id?'sel':''}" onclick="selected=cs.find(x=>x.id==='${c.id}');render()"><div class="avatar">${c.email[0].toUpperCase()}</div><div class="grow"><b>${c.subject}</b><span>${c.email}</span><span>${c.shop} · ${c.order}</span></div>${badge(c.status)}</div>`).join('')}
function conversation(){return `<div class="convhead"><div><b>${selected.subject}</b><div class="muted">${selected.email} · ${selected.shop} · ${selected.order}</div></div>${badge(selected.status)}</div><div class="messages"><div class="bubble customer"><b>客户</b><br>${selected.body}</div><div class="bubble ai"><b>AI 建议回复</b><br>感谢您的来信。我已根据订单 ${selected.order} 查询当前物流状态。包裹目前仍在运输中，我们会继续跟进物流更新。如果 48 小时内仍没有新的扫描记录，我们可以进一步为您处理。<br><br>Best regards,<br>Customer Support</div></div><div class="composer"><textarea>Hi,

感谢您的来信。我们已经查询了订单 ${selected.order} 的最新状态。

</textarea><div class="actions"><button class="btn" onclick="toast('已重新生成 AI 回复')">✦ 重新生成</button> <button class="btn primary" onclick="toast('Demo：邮件已发送，状态已进入 AI 已回复')">发送回复</button></div></div>`}
function aftersales(){return `<div class="toolbar"><div class="muted">售后记录支持时间筛选与 CSV 导出</div><button class="btn primary" onclick="toast('Demo：已生成 CSV 导出')">↓ 导出 CSV</button></div><div class="card"><table class="table"><tr><th>售后编号</th><th>客户 / 订单</th><th>问题类型</th><th>记录的问题</th><th>已提供措施</th><th>状态</th><th>首次跟进</th></tr>${[['AS-202609-001','sarah@example.com / #US-10482','物流延误','运输中超过 4 天','跟进物流并提供最新状态','跟进中','2026-09-09 20:18'],['AS-202609-002','james@example.co.uk / #UK-8821','商品破损','开箱发现外壳破损','已要求客户提供照片并说明退款方案','跟进中','2026-09-09 19:42'],['AS-202609-003','emma@example.de / #EU-3208','物流查询','客户询问包裹位置','已发送最新物流节点','已完成','2026-09-06 14:20']].map(r=>`<tr>${r.map((x,i)=>`<td>${i===5?badge(x):x}</td>`).join('')}</tr>`).join('')}</table></div>`}
function generic(title,body){return `<div class="card"><h3>${title}</h3><p class="muted">${body}</p><div class="notice">这是纯 Demo 在线预览。按钮、状态、导航均可交互，但不会连接真实 Shopify、腾讯企业邮箱或 AI API。</div><br><button class="btn primary" onclick="toast('Demo：操作已完成')">保存设置</button></div>`}
function render(){let c=document.getElementById('content');if(page==='总览')c.innerHTML=dashboard();else if(page==='邮件收件箱'||page==='AI 回复队列'){c.innerHTML=inbox();renderInbox()}else if(page==='订单售后')c.innerHTML=aftersales();else if(page==='Shopify 店铺')c.innerHTML=generic('Shopify 店铺','4 个模拟店铺：US Main Store、UK Store、EU Store、AU Store。支持在线状态、订单量和授权状态展示。');else if(page==='AI 回复规则')c.innerHTML=generic('AI 回复规则','店铺识别优先级：订单号 / 对话历史 → 收件人 → 客户邮箱 → SKU → AI 推断；系统通知自动过滤；客户 3 天无回复自动关闭。');else if(page==='知识库')c.innerHTML=generic('知识库','物流与配送、退货退款、产品知识、客服话术。');else if(page==='邮箱设置')c.innerHTML=generic('腾讯企业邮箱','IMAP：imap.exmail.qq.com · SMTP：smtp.exmail.qq.com · support@demo-shop.com（模拟连接）。');else c.innerHTML=generic('系统设置','系统名称、AI 模型、售后自动关闭天数等配置。')}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>go(x.dataset.page));render();
</script></body></html>
